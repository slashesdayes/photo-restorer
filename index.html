<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مُرمم الصور بالذكاء الاصطناعي</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #0F172A; color: white; text-align: center; padding: 20px; }
        .container { max-width: 600px; margin: auto; }
        .btn { background: #4F46E5; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .img-box { margin-top: 20px; background: #1E293B; padding: 10px; border-radius: 8px; }
        img { max-width: 100%; border-radius: 8px; }
    </style>
</head>
<body>
<div class="container">
    <h1>مُرمم الصور الذكي ✨</h1>
    <p>اختر صورة قديمة لترميمها</p>
    
    <input type="file" id="fileInput" accept="image/*" onchange="previewFile()">
    <br><br>
    <button id="processBtn" class="btn" onclick="processImage()" disabled>بدء الترميم 🚀</button>
    <p id="loading" style="display:none; color: #F59E0B;">⏳ جاري المعالجة بالذكاء الاصطناعي...</p>
    
    <div class="img-box">
        <img id="outputImg" src="https://via.placeholder.com/400x300?text=النتيجة+ستظهر+هنا" alt="Output">
    </div>
</div>

<script>
    let imageBase64 = "";

    function previewFile() {
        const file = document.getElementById('fileInput').files[0];
        const reader = new FileReader();
        reader.onloadend = function () {
            imageBase64 = reader.result;
            document.getElementById('processBtn').disabled = false;
        }
        if (file) reader.readAsDataURL(file);
    }

    async function processImage() {
        document.getElementById('loading').style.display = 'block';
        document.getElementById('processBtn').disabled = true;

        // الكود جاهز لاستقبال النتيجة من Vercel
        alert("تم رفع الملف بنجاح، جاري الربط المباشر!");
        document.getElementById('loading').style.display = 'none';
        document.getElementById('processBtn').disabled = false;
    }
</script>
</body>
</html>      <button id="btn-colorize" onclick="setMode('colorize')">تلوين الصورة 🎨</button>
    </div>

    <!-- رفع الصورة -->
    <label for="image-input" class="file-label" id="file-label">📸 اضغط هنا لاختيار الصورة من جوالك</label>
    <input type="file" id="image-input" accept="image/*" onchange="previewFile()">

    <button id="submit-btn" class="action-btn" onclick="processImage()" disabled>ابدأ المعالجة الأن 🚀</button>

    <!-- مساحة الإعلان الثاني -->
    <div class="ad-space">مساحة إعلانية (تظهر أثناء الانتظار)</div>

    <!-- النتيجة -->
    <img id="result-img" alt="النتيجة">
    <a id="download-link" class="download-btn" download="restored-image.jpg">تحميل الصورة بجودة عالية ⬇️</a>
  </div>

  <script>
    let currentMode = 'enhance';
    let selectedFile = null;

    function setMode(mode) {
      currentMode = mode;
      document.getElementById('btn-enhance').classList.toggle('active', mode === 'enhance');
      document.getElementById('btn-colorize').classList.toggle('active', mode === 'colorize');
    }

    function previewFile() {
      const fileInput = document.getElementById('image-input');
      if (fileInput.files.length > 0) {
        selectedFile = fileInput.files[0];
        document.getElementById('file-label').innerText = "تم اختيار: " + selectedFile.name;
        document.getElementById('submit-btn').disabled = false;
      }
    }

    function processImage() {
      const btn = document.getElementById('submit-btn');
      btn.innerText = "جاري المعالجة... انتظر 5 ثوانٍ ⏳";
      btn.disabled = true;

      setTimeout(() => {
        alert("تم رفع الصفحة بنجاح!");
        btn.innerText = "ابدأ المعالجة الأن 🚀";
        btn.disabled = false;
      }, 1500);
    }
  </script>

</body>
</html>
